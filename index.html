<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas | Portfólio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1><i class="fa-solid fa-store" aria-hidden="true"></i> Sistema de Vendas</h1>
            <p>Aplicação web para cadastro de produtos, cálculo automático de valores e prática de Front-end.</p>
            <div class="hero-buttons">
                <a href="#sistema" class="btn primary">Ir para o Sistema</a>
                <a href="https://github.com/Maristelacosta-jpg" target="_blank" rel="noopener noreferrer" class="btn secondary">
                    <i class="fa-brands fa-github" aria-hidden="true"></i> GitHub
                </a>
            </div>
        </div>
    </header>

    <main id="sistema" class="container">
        <section class="card">
            <h2><i class="fa-solid fa-plus-circle" aria-hidden="true"></i> Novo Produto</h2>
            <form id="productForm" class="form-grid">
                <div class="form-group">
                    <label for="productName">Nome do produto</label>
                    <input type="text" id="productName" placeholder="Ex.: Camiseta Básica" required>
                </div>

                <div class="form-group">
                    <label for="productPrice">Preço (R$)</label>
                    <input type="number" id="productPrice" step="0.01" min="0.01" placeholder="Ex.: 49.90" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn primary">
                        <i class="fa-solid fa-plus" aria-hidden="true"></i> Adicionar
                    </button>
                    <button type="button" id="clearAllBtn" class="btn-delete">
                        <i class="fa-solid fa-trash-can" aria-hidden="true"></i> Limpar Tudo
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2><i class="fa-solid fa-table" aria-hidden="true"></i> Produtos Cadastrados</h2>
            <div class="table-wrapper">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                    <tfoot>
                        <tr>
                            <td><strong>Total</strong></td>
                            <td id="totalValue"><strong>R$ 0,00</strong></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Maristela Costa — Curitiba, PR, Brasil 📍</p>
    </footer>
</body>
</html>
